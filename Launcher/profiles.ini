; Ray Regen Bridge launcher: per game settings. Section = the game's exe file name (lowercase).
; Name     display name
; ExeDir   folder of the exe inside the game folder (informational)
; Proxy    dll name OptiScaler is installed as (default: picked from what the exe imports)
; Ini      OptiScaler.ini values to set, Section.Key=value separated by ;
; Notes    shown in the launcher

[cyberpunk2077.exe]
Name=Cyberpunk 2077
ExeDir=bin\x64
Proxy=winmm.dll
Notes=Path Tracing on, DLSS as the upscaler, Ray Reconstruction on. Tested on an RX 9070 XT. Some sessions end in a GPU hang inside the game's own path tracing (see the README).

[witcher3.exe]
Name=The Witcher 3: Wild Hunt (DirectX 12)
ExeDir=bin\x64_dx12
Proxy=winmm.dll
Notes=Start the DirectX 12 version. Path Tracing on, DLSS, Ray Reconstruction on. Fog is still removed by the denoiser.

[crimsondesert.exe]
Name=Crimson Desert
ExeDir=bin64
Proxy=winmm.dll
Ini=Inputs.EnableHotSwapping=true;Inputs.UseFfxInputs=false
Notes=Has FSR Ray Regeneration natively; DLSS isn't offered on AMD (no GPU spoofing in this game). Installing only logs what the game sends to its denoiser. Don't switch upscalers in the game's menu, it freezes.
